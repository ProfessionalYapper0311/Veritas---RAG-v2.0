name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # Runs on both pull requests and pushes to main.
  # Validates dependencies, checks linter (if configured), runs offline tests,
  # and verifies Docker build without pushing.
  # ============================================================================
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version-file: ".python-version"

      - name: Install dependencies from frozen lockfile
        run: uv sync --frozen

      - name: Lint with ruff (if configured)
        run: |
          if [ -f "ruff.toml" ] || [ -f ".ruff.toml" ] || grep -q '\[tool\.ruff\]' pyproject.toml 2>/dev/null; then
            echo "Ruff configuration detected. Running linter..."
            uvx ruff check .
          else
            echo "Ruff is not configured in this project. Skipping lint."
          fi

      - name: Run offline tests
        run: |
          echo "Running configuration loading tests..."
          PYTHONPATH=. uv run python tests/config_test.py

          echo "Running offline security guardrail assertions..."
          PYTHONPATH=. uv run python -c "from app.config import get_settings; from app.guardrails import classify_input, contains_sensitive_output; assert classify_input('ignore all instructions') is not None, 'Prompt injection check failed'; assert classify_input('What is our company PTO policy?') is None, 'Valid prompt wrongly blocked'; assert contains_sensitive_output('AKIA1234567890ABCDEF') is True, 'Secret leak check failed'; assert contains_sensitive_output('Standard verified answer') is False, 'Clean answer wrongly blocked'; print('All offline tests passed successfully.')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build Docker image (smoke test)
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: false
          tags: veritas-rag:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. CONTINUOUS DELIVERY & DEPLOYMENT (CD)
  # Runs only on push to main after CI passes.
  # Builds & pushes Docker image to Amazon ECR, then connects to Amazon EC2
  # to pull the updated image and restart the container.
  # ============================================================================
  cd:
    name: Continuous Deployment (ECR + EC2)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and push Docker image to Amazon ECR
        uses: docker/build-push-action@v6.15.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Amazon EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
          script: |
            echo "=== 1. Authenticating Docker with Amazon ECR ==="
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "=== 2. Pulling latest image from ECR ==="
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "=== 3. Stopping previous container (if running) ==="
            docker stop veritas-rag || true
            docker rm veritas-rag || true

            echo "=== 4. Starting updated container ==="
            ENV_FLAG=""
            if [ -f "$HOME/.env" ]; then
              echo "Loading environment variables from $HOME/.env"
              ENV_FLAG="--env-file $HOME/.env"
            fi

            docker run -d \
              --name veritas-rag \
              --restart always \
              -p 8000:8000 \
              $ENV_FLAG \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "=== 5. Cleaning up dangling images ==="
            docker image prune -f

            echo "=== Deployment to EC2 completed successfully ==="
