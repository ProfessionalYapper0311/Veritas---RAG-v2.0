[project]
name = "veritas-rag-v2-0"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rupam Biswas", email = "rupambiswaspilot123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.3",
    "fastapi>=0.162.7",
    "glassflow-rius>=1.5.6",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.22",
    "pinecone>=10.3.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
veritas-rag-v2-0 = "veritas_rag_v2_0:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"
